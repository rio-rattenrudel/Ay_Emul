<H1><A NAME="winman"></A>Windows managing</H1>

<P>Four Ay_Emul windows can be active at one time: main, playlist, mixer and tools. You can switch between these windows by mouse clicks.</P>
<P>By the way, you can play music and switch windows even during work of "Search for tools in files" tool.</P>
